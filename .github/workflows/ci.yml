name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch, locked scientific stack)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy==2.1.3 scipy==1.16.3 scikit-learn==1.6.1 pandas==2.2.3 matplotlib==3.10.0 tokenizers==0.23.1 pytest nbformat pypdf
      - name: Notebook matches src/
        run: python tools/sync_notebook.py --check
      - name: No test-label access before the final step
        run: python tools/check_test_access.py
      - name: Report numbers match their result files
        run: python tools/check_report_numbers.py
      - name: Submission format (template, author, final mode, six-page limit)
        run: python tools/build_submission.py --check-only
      - name: Unit, resume and smoke tests
        run: python -m pytest tests -q
